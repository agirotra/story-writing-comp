<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bukmuk Inter-School Short Story Writing Championship 2026</title>

  <!-- This site has moved to bukmukpublishing.com/competition.
       GitHub Pages cannot issue a 301, so the canonical link carries the SEO
       and the refresh plus the script move real visitors. Do not delete this
       page: posters, WhatsApp forwards and Instagram bios point here. -->
  <link rel="canonical" href="https://bukmukpublishing.com/competition" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=https://bukmukpublishing.com/competition" />

  <meta name="description" content="The Bukmuk Inter-School Short Story Writing Championship 2026 has moved to bukmukpublishing.com/competition. Entries close 15 September 2026." />
  <link rel="icon" href="https://bukmuk.com/assets/darklogo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@300;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />

  <style>
    :root { --ink-violet:#4318CE; --display-violet:#4A1FD6; --signal-lime:#CBEF2E;
            --paper:#F2F7E7; --night:#232838; --body:#3F4356; --faint:#8A8CA0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
           background:var(--paper); color:var(--body);
           font-family:'Poppins',system-ui,sans-serif; font-weight:300; }
    .card { max-width:560px; text-align:center; }
    .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.26em;
               text-transform:uppercase; color:var(--faint); }
    h1 { font-family:'Playfair Display',Georgia,serif; font-style:italic; font-weight:700;
         font-size:clamp(2rem,6vw,3rem); line-height:1.05; color:var(--display-violet);
         margin:16px 0 0; }
    p { font-size:17px; line-height:1.55; margin:18px 0 0; }
    .btn { display:inline-block; margin-top:28px; background:var(--signal-lime); color:var(--night);
           font-weight:600; font-size:17px; padding:16px 30px; border-radius:999px;
           text-decoration:none; }
    .small { font-size:13px; color:var(--faint); margin-top:24px; }
    .small a { color:var(--display-violet); }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Bukmuk Publishing</p>
    <h1>The championship has a new home.</h1>
    <p>
      The Inter-School Short Story Writing Championship now lives on the main Bukmuk Publishing
      site. Entries close 15 September 2026.
    </p>
    <a class="btn" href="https://bukmukpublishing.com/competition">Go to the championship</a>
    <p class="small">
      Taking you there now. If nothing happens,
      <a href="https://bukmukpublishing.com/competition">tap here</a>.
      Questions? <a href="mailto:helpdesk@bukmuk.com">helpdesk@bukmuk.com</a>
    </p>
  </div>

  <script>
    // Carry any tracking query string across, so campaign attribution survives.
    location.replace("https://bukmukpublishing.com/competition" + (location.search || ""));
  </script>
</body>
</html>
