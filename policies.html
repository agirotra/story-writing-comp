<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terms, refunds and privacy — Bukmuk Competition 2026</title>

  <!-- Moved to bukmukpublishing.com/competition/policies. The old terms quoted a
       ₹490 fee and a 31 August deadline, both of which are now wrong, so this
       page must not keep serving them. -->
  <link rel="canonical" href="https://bukmukpublishing.com/competition/policies" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=https://bukmukpublishing.com/competition/policies" />
  <link rel="icon" href="https://bukmuk.com/assets/darklogo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@300;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />

  <style>
    :root { --display-violet:#4A1FD6; --signal-lime:#CBEF2E; --paper:#F2F7E7;
            --night:#232838; --body:#3F4356; --faint:#8A8CA0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
           background:var(--paper); color:var(--body);
           font-family:'Poppins',system-ui,sans-serif; font-weight:300; }
    .card { max-width:560px; text-align:center; }
    .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.26em;
               text-transform:uppercase; color:var(--faint); }
    h1 { font-family:'Playfair Display',Georgia,serif; font-style:italic; font-weight:700;
         font-size:clamp(1.8rem,5vw,2.6rem); line-height:1.05; color:var(--display-violet);
         margin:16px 0 0; }
    p { font-size:17px; line-height:1.55; margin:18px 0 0; }
    .btn { display:inline-block; margin-top:28px; background:var(--signal-lime); color:var(--night);
           font-weight:600; font-size:17px; padding:16px 30px; border-radius:999px;
           text-decoration:none; }
    .small { font-size:13px; color:var(--faint); margin-top:24px; }
    .small a { color:var(--display-violet); }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Bukmuk Publishing</p>
    <h1>These terms have moved.</h1>
    <p>The current terms, refund policy and privacy policy are on the main site.</p>
    <a class="btn" href="https://bukmukpublishing.com/competition/policies">Read the current terms</a>
    <p class="small">
      Taking you there now. If nothing happens,
      <a href="https://bukmukpublishing.com/competition/policies">tap here</a>.
    </p>
  </div>

  <script>
    location.replace("https://bukmukpublishing.com/competition/policies");
  </script>
</body>
</html>
